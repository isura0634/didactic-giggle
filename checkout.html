<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h2>إتمام الطلب</h2>
<form class="checkout-form">
  <input placeholder="الاسم">
  <input placeholder="رقم الموبايل">
  <input placeholder="العنوان">
  <select>
    <option>الدفع عند الاستلام</option>
    <option>فيزا / ماستر كارد</option>
  </select>
  <select>
    <option>شحن عادي (3-5 أيام)</option>
    <option>شحن سريع</option>
  </select>
  <button type="submit">تأكيد الطلب</button>
</form>
<p class="note">⚠️ هذه عملية تجريبية فقط</p>
</body>
</html>
